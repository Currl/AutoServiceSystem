name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动运行

jobs:
  build_windows:
    runs-on: windows-latest  # 重点：使用运行 Windows 的服务器

    steps:
    - uses: actions/checkout@v4 # 1. 检出代码

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt # 2. 安装 PyInstaller

    - name: Run PyInstaller
      run: |
        # --add-data "数据库文件名;." 确保打包后的exe能找到数据库
        pyinstaller --onefile --windowed --add-data "auto_service_log.db;." --name "汽修服务系统" ServiceApp.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # 3. 将结果打包并上传
      with:
        name: 汽修服务系统-Windows-EXE
        path: dist/汽修服务系统.exe
        # Trigger rebuild
